name: WhatsApp follow-up nudge scan

# Triggers the deployed webhook's /followups-scan endpoint on a schedule so
# idle buyers (never booked their call, or went quiet mid-inquiry) get a
# single automatic nudge — see conversation_store.scan_for_followups() and
# main.py's /followups-scan for the actual send logic and dedup rules.
#
# Setup (one-time):
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret
#      Name:  FOLLOWUPS_CRON_TOKEN
#      Value: same random string you set as FOLLOWUPS_CRON_TOKEN in Render's
#             Environment tab (generate one with:
#             python3 -c "import secrets; print(secrets.token_urlsafe(32))")
#   2. Repo → Settings → Secrets and variables → Actions → New repository variable
#      Name:  WEBHOOK_BASE_URL
#      Value: https://whatsapp-webhook-gateway-e08w.onrender.com
#      (or your current Render service URL, if it ever changes)
#
# Render's free plan spins the service down after 15 minutes idle — this
# hourly ping also acts as a keep-alive, which is a side benefit, not the
# point of this workflow.

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour (UTC)
  workflow_dispatch: {} # manual "Run workflow" button for on-demand testing

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call /followups-scan
        run: |
          set -e
          url="${WEBHOOK_BASE_URL:?WEBHOOK_BASE_URL repo variable is not set}"
          if [ -z "${FOLLOWUPS_CRON_TOKEN}" ]; then
            echo "::warning::FOLLOWUPS_CRON_TOKEN secret is not set — the endpoint will still run but logs a WARN and accepts unauthenticated calls. Set the secret to secure it."
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${FOLLOWUPS_CRON_TOKEN}" \
            "${url%/}/followups-scan")
          echo "HTTP status: $http_code"
          cat response.json
          echo
          if [ "$http_code" -ge 300 ]; then
            echo "::error::followups-scan returned HTTP $http_code"
            exit 1
          fi
        env:
          FOLLOWUPS_CRON_TOKEN: ${{ secrets.FOLLOWUPS_CRON_TOKEN }}
          WEBHOOK_BASE_URL: ${{ vars.WEBHOOK_BASE_URL }}
